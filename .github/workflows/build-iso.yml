name: Build neweraseOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Create output directories
        run: |
          mkdir -p out
          chmod 777 out

      - name: Build neweraseOS ISO in Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:latest bash -c "
              set -e
              echo '>>> Initializing pacman keys...'
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archlinux-keyring
              pacman -S --noconfirm archiso git zstd sed grep coreutils

              echo '>>> Preparing neweraseOS profile based on releng...'
              rm -rf /tmp/newerase-profile
              cp -r /usr/share/archiso/configs/releng /tmp/newerase-profile

              echo '>>> Configuring neweraseOS profile metadata...'
              sed -i 's/iso_name=.*/iso_name=\"neweraseOS\"/' /tmp/newerase-profile/profiledef.sh
              sed -i 's/iso_label=.*/iso_label=\"NEWERASE_\$(date +%Y%m)\"/' /tmp/newerase-profile/profiledef.sh
              sed -i 's/iso_publisher=.*/iso_publisher=\"neweraseOS Project\"/' /tmp/newerase-profile/profiledef.sh

              echo '>>> Enabling multilib repository for 32-bit Wine & games...'
              sed -i '/\[multilib\]/,/Include/ s/^#//' /tmp/newerase-profile/pacman.conf

              echo '>>> Appending neweraseOS gaming, desktop and aesthetic packages...'
              cat /workspace/archiso/packages.x86_64 >> /tmp/newerase-profile/packages.x86_64
              sort -u /tmp/newerase-profile/packages.x86_64 -o /tmp/newerase-profile/packages.x86_64

              echo '>>> Injecting neweraseOS airootfs overlays and configs...'
              cp -r /workspace/archiso/airootfs/* /tmp/newerase-profile/airootfs/

              echo '>>> Configuring systemd for graphical auto-start (SDDM + LiveUser)...'
              mkdir -p /tmp/newerase-profile/airootfs/etc/systemd/system/multi-user.target.wants
              mkdir -p /tmp/newerase-profile/airootfs/etc/systemd/system/graphical.target.wants
              ln -sf /usr/lib/systemd/system/sddm.service /tmp/newerase-profile/airootfs/etc/systemd/system/display-manager.service
              ln -sf /etc/systemd/system/newerase-live-init.service /tmp/newerase-profile/airootfs/etc/systemd/system/multi-user.target.wants/newerase-live-init.service
              chmod +x /tmp/newerase-profile/airootfs/usr/local/bin/* || true

              echo '>>> Starting mkarchiso compilation...'
              mkarchiso -v -w /tmp/archiso-work -o /workspace/out /tmp/newerase-profile

              echo '>>> Build finished successfully!'
              ls -lh /workspace/out
            "

      - name: Generate SHA256 checksums
        run: |
          cd out
          sha256sum *.iso > sha256sum.txt
          cat sha256sum.txt

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neweraseOS-ISO
          path: |
            out/*.iso
            out/sha256sum.txt
          retention-days: 7
