# ====================================================================
# neweraseOS High-Performance Gaming Sysctl Tweaks
# ====================================================================

# Crucial for Wine, Proton, DayZ, Star Citizen, Unreal Engine, and GTA mods:
vm.max_map_count = 2147483642

# Memory management: prioritize physical RAM over swap
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Increase maximum open files for heavy modded games (CRMP/GTA:SA)
fs.file-max = 2097152

# Low-latency networking optimizations (BBR congestion control)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
